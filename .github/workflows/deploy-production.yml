name: Deploy Production

on:
  workflow_run:
    workflows: ["Tests - Unit, Integration and Playwright E2E"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require production configuration
        env:
          PRODUCTION_DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          test -n "$PRODUCTION_DEPLOY_HOOK" || { echo "Missing PRODUCTION_DEPLOY_HOOK secret"; exit 1; }
          test -n "$PRODUCTION_URL" || { echo "Missing PRODUCTION_URL secret"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and validate production container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ecologistica-huancayo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Production (Render / Railway / Webhook)
        env:
          PRODUCTION_DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          curl -fsS -X POST "$PRODUCTION_DEPLOY_HOOK"
          echo "Production deployment trigger dispatched."

      - name: Health check verification of production endpoint
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          for i in {1..20}; do
            curl -fsS "$PRODUCTION_URL/api/health" && exit 0
            sleep 5
          done
          echo "Production health check failed"
          exit 1
