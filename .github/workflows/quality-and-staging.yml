name: Quality and staging

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Backend tests and coverage gate
        working-directory: backend
        run: |
          coverage run --source=app -m unittest discover -s tests
          coverage report --fail-under=80
          coverage xml
      - name: Static security and dependency audit
        working-directory: backend
        run: |
          bandit -r app -ll -ii
          pip-audit -r requirements.txt
      - name: EN-05 spatial CPU benchmark
        working-directory: backend
        run: python tests/spatial_benchmark.py
      - name: Frontend quality
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Browser runtime
        working-directory: backend
        run: python -m playwright install --with-deps chromium
      - name: Browser acceptance PT-01–PT-11
        shell: bash
        run: |
          cd backend
          python seed_data.py
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/ecologistica.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          mkdir -p test-artifacts
          python tests/browser_sprint3.py | tee test-artifacts/browser-sprint3.json
      - name: Publish validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            backend/coverage.xml
            backend/test-artifacts/
            frontend/dist/

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - name: Configure cluster and secrets
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_STAGING }}
          DATA_KEY: ${{ secrets.DATA_ENCRYPTION_KEY_STAGING }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_STAGING }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          kubectl apply -f deploy/k8s/app.yaml
          kubectl -n ecologistica-staging create secret generic ecologistica-secrets \
            --from-literal=jwt-secret="$JWT_SECRET" --from-literal=data-key="$DATA_KEY" \
            --from-literal=database-url="$DATABASE_URL" --dry-run=client -o yaml | kubectl apply -f -
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm upgrade --install ecologistica-db bitnami/postgresql-ha \
            -n ecologistica-staging --create-namespace -f deploy/k8s/postgresql-ha-values.yaml \
            --set postgresql.password="$POSTGRES_PASSWORD"
          kubectl -n ecologistica-staging set image deployment/ecologistica \
            app=ghcr.io/${{ github.repository }}:${{ github.sha }}
          kubectl -n ecologistica-staging rollout status deployment/ecologistica --timeout=5m
