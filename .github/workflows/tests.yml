name: Tests - Unit, Integration and Playwright E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend unit and integration tests with coverage
        working-directory: backend
        run: |
          coverage run --source=app -m unittest discover -s tests -v
          coverage report --fail-under=80
          coverage xml

      - name: Run spatial and Green Software benchmarks
        working-directory: backend
        run: |
          python tests/spatial_benchmark.py
          python tests/green_software_benchmark.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: |
          npm test

      - name: Install Playwright browsers with system dependencies
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium firefox webkit

      - name: Start backend server for E2E
        working-directory: backend
        shell: bash
        run: |
          python seed_data.py
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Measure local API latency
        working-directory: backend
        run: python tests/api_latency_probe.py

      - name: Build frontend for E2E
        working-directory: frontend
        shell: bash
        run: npm run build

      - name: Execute Playwright E2E tests (Chromium, Firefox, WebKit)
        working-directory: frontend
        run: |
          npx playwright test

      - name: Upload Playwright test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/test-artifacts/api-latency-local.json
          retention-days: 14

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-evidence
          path: backend/coverage.xml
          retention-days: 14
