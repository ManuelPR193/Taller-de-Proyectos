<!DOCTYPE html>
<html lang="es">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>

  <body class="bg-[#070b14] text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white">
