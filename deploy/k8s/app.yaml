apiVersion: v1
kind: Namespace
metadata:
  name: ecologistica-staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecologistica
  namespace: ecologistica-staging
spec:
  replicas: 2
  selector:
    matchLabels: {app: ecologistica}
  template:
    metadata:
      labels: {app: ecologistica}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: ghcr.io/OWNER/REPOSITORY:staging
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: ENVIRONMENT, value: staging}
            - {name: CORS_ORIGINS, value: "https://staging.ecologistica.example"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ecologistica-secrets, key: database-url}}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: ecologistica-secrets, key: jwt-secret}}
            - name: DATA_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: ecologistica-secrets, key: data-key}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ecologistica
  namespace: ecologistica-staging
spec:
  selector: {app: ecologistica}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecologistica
  namespace: ecologistica-staging
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ecologistica}
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ecologistica
  namespace: ecologistica-staging
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: ecologistica}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecologistica
  namespace: ecologistica-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-protocols: TLSv1.3
spec:
  tls:
    - hosts: [staging.ecologistica.example]
      secretName: ecologistica-staging-tls
  rules:
    - host: staging.ecologistica.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: ecologistica, port: {name: http}}
