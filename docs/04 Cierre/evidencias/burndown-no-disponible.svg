<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="t d"><title id="t">Burndown diario no disponible</title><desc id="d">Los informes guardan totales por sprint, pero no una serie diaria; no se fabrica una curva.</desc><rect width="920" height="440" rx="10" fill="#f4f5ef"/><g font-family="Arial,sans-serif" fill="#172b23"><text x="36" y="48" font-size="23" font-weight="700">Sprint 4: serie diaria no registrada</text><text x="36" y="80" font-size="14" fill="#53675c">Los informes disponibles no aportan compromiso inicial ni valores restantes por día.</text><line x1="100" y1="355" x2="840" y2="355" stroke="#aebbb1"/><line x1="100" y1="130" x2="100" y2="355" stroke="#aebbb1"/><line x1="112" y1="335" x2="828" y2="150" stroke="#b85c50" stroke-width="2" stroke-dasharray="6 8"/><text x="470" y="208" font-size="16">No hay observaciones diarias</text><text x="110" y="390" font-size="14" fill="#53675c">La diagonal no representa datos: solo señala que no se guardó la serie.</text></g></svg>
