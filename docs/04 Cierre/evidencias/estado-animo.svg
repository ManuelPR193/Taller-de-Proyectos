<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="t d"><title id="t">Ánimo grupal por sprint</title><desc id="d">Valoración de cuatro sobre cinco registrada en Sprints 1, 2 y 3. Sprint 4 no tiene dato.</desc><rect width="920" height="480" rx="10" fill="#f4f5ef"/><g font-family="Arial,sans-serif" fill="#172b23"><text x="36" y="48" font-size="23" font-weight="700">Ánimo grupal transcrito de retrospectivas</text><text x="36" y="78" font-size="14" fill="#53675c">Escala 1–5 · fuente: fila “Equipo del proyecto” de retrospectivas S1–S3</text><line x1="110" y1="350" x2="850" y2="350" stroke="#aebbb1"/><line x1="110" y1="120" x2="110" y2="350" stroke="#aebbb1"/><g stroke="#dde4de"><line x1="110" y1="304" x2="850" y2="304"/><line x1="110" y1="258" x2="850" y2="258"/><line x1="110" y1="212" x2="850" y2="212"/><line x1="110" y1="166" x2="850" y2="166"/><line x1="110" y1="120" x2="850" y2="120"/></g><g font-size="13" fill="#53675c"><text x="80" y="355">0</text><text x="80" y="309">1</text><text x="80" y="263">2</text><text x="80" y="217">3</text><text x="80" y="171">4</text><text x="80" y="125">5</text></g><polyline points="220,166 430,166 640,166" fill="none" stroke="#547d5d" stroke-width="4"/><g fill="#547d5d"><circle cx="220" cy="166" r="7"/><circle cx="430" cy="166" r="7"/><circle cx="640" cy="166" r="7"/></g><circle cx="790" cy="166" r="9" fill="#f4f5ef" stroke="#b85c50" stroke-width="3" stroke-dasharray="4 3"/><g font-size="15"><text x="198" y="385">Sprint 1 · 4</text><text x="408" y="385">Sprint 2 · 4</text><text x="618" y="385">Sprint 3 · 4</text><text x="748" y="385">Sprint 4 · N/D</text></g><text x="36" y="435" font-size="14" fill="#53675c">Dato grupal, no individual. Sprint 4 sin puntuación registrada.</text></g></svg>
