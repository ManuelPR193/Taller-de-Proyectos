<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="t d"><title id="t">EVM no calculable</title><desc id="d">Faltan baseline de costo calendarizada, regla para valor ganado y costos reales registrados; los índices y EAC no están disponibles.</desc><rect width="920" height="440" rx="10" fill="#f4f5ef"/><g font-family="Arial,sans-serif" fill="#172b23"><text x="36" y="48" font-size="23" font-weight="700">EVM no calculable con la evidencia disponible</text><text x="36" y="85" font-size="16">Faltan tres entradas básicas para un corte reproducible:</text><g><rect x="36" y="125" width="260" height="150" rx="8" fill="#e4eae3"/><rect x="330" y="125" width="260" height="150" rx="8" fill="#e4eae3"/><rect x="624" y="125" width="260" height="150" rx="8" fill="#e4eae3"/></g><g font-size="20" font-weight="700"><text x="58" y="163">PV</text><text x="352" y="163">EV</text><text x="646" y="163">AC</text></g><g font-size="15"><text x="58" y="197">Sin baseline de costo</text><text x="58" y="221">por periodo aprobada</text><text x="352" y="197">Sin regla de valor</text><text x="352" y="221">ganado / aceptación</text><text x="646" y="197">Sin horas/gastos</text><text x="646" y="221">reales registrados</text></g><text x="36" y="330" font-size="23" font-weight="700">SV, CV, SPI, CPI y EAC: N/D</text><text x="36" y="366" font-size="14" fill="#53675c">El presupuesto de S/ 11 319 es referencial y difiere del acta (S/ 0–250).</text><text x="36" y="396" font-size="14" fill="#53675c">No convertir SP ni ausencia de recibos en costo real cero.</text></g></svg>
